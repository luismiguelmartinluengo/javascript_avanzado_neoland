<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de la compra</title>
    <script src="js/lista_compra.js" defer></script>
    <link rel="stylesheet" href="css/lista_compra.css">
</head>
<body>
    <header>
        <h1>Lista de la compra</h1>
    </header>
    <main>
        <form id="formulario">
            <input type="text" id="txtNuevoArticulo" placeholder="Nuevo artículo">
            <button type="button" id="btnAñadirArticulo" disabled>Añadir artículo</button>
            <button type="button" id="btnNuevaLista">Nueva lista de la compra</button>
        </form>
        <ul id="ulLista">
            <li>No hay nada que comprar</li>
        </ul>
    </main>
    
</body>
</html>
